[project]
name = "blockchain-ticketing-dapp"
version = "0.2.0"
description = "Web3 ticketing DApp project tooling configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "commitizen>=3.29.0",
  "pre-commit>=3.8.0",
  "ruff>=0.6.9",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
tag_format = "v$version"
version_scheme = "pep440"
version_files = [
  "pyproject.toml:project.version",
  "package.json:version",
  "frontend/package.json:version",
]
update_changelog_on_bump = false
major_version_zero = true
